[package]
edition = "2021"
name = "nv1-stm32-md"
version = "0.1.0"

[dependencies]
nv1-msg = { path = "../nv1-msg" }

corncobs = "0.1.4"
cortex-m = { version = "0.7.7", features = [
    "inline-asm",
    "critical-section-single-core",
] }
cortex-m-rt = "0.7.5"
defmt = { version = "1.0.1", optional = true }
defmt-rtt = { version = "1.1.0", optional = true }
embassy-executor = { version = "0.10.0", features = [
    "platform-cortex-m",
    "executor-thread",
] }
embassy-futures = "0.1.2"
embassy-stm32 = { version = "0.6.0", features = [
    "memory-x",
    "stm32f446re",
    "time-driver-tim12",
    "exti",
    "unstable-pac",
    "time",
] }
embassy-sync = "0.8.0"
embassy-time = { version = "0.5.1", features = ["tick-hz-32_768"] }
heapless = "0.9.2"
panic-halt = "1.0.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"], optional = true }
pid = "4.0.0"
postcard = "1.1.3"
embedded-alloc = "0.7.0"
libm = "0.2.16"
midly = { version = "0.5.3", default-features = false }

[[bin]]
name = "nv1-stm32-md"
test = false
bench = false

[profile.dev]
debug = true
lto = true
opt-level = 3
incremental = true

[profile.release]
debug = false
lto = true
opt-level = 3
incremental = true

[features]
defmt = ["dep:defmt"]
defmt-rtt = ["dep:defmt-rtt"]
panic-probe = ["dep:panic-probe"]
default = ["debug"]
debug = [
    "defmt",
    "defmt-rtt",
    "panic-probe",
    "embassy-executor/defmt",
    "embassy-sync/defmt",
    "embassy-futures/defmt",
    "embassy-time/defmt",
    "embassy-time/defmt-timestamp-uptime",
    "embassy-stm32/defmt",
]
