cargo-features = ["per-package-target"]

[package]
edition = "2021"
name = "nv1-hub"
version = "0.1.0"
forced-target = "thumbv7em-none-eabi"

[dependencies]
nv1-hub-ui = { path = "../nv1-hub-ui", features = ["no_std"] }
nv1-msg = { path = "../../nv1-msg" }

corncobs = "0.1.4"
cortex-m = { version = "0.7.7", features = [
    "inline-asm",
    "critical-section-single-core",
] }
cortex-m-rt = "0.7.5"
defmt = { version = "1.0.1", optional = true }
defmt-rtt = { version = "1.1.0", optional = true }
embassy-executor = { version = "0.10.0", features = [
    "platform-cortex-m",
    "executor-thread",
    "nightly",
] }
embassy-futures = "0.1.2"
embassy-stm32 = { version = "0.6.0", features = [
    "memory-x",
    "stm32f446re",
    "time-driver-tim12",
    "exti",
    "unstable-pac",
] }
embassy-sync = "0.8.0"
embassy-time = { version = "0.5.1", features = ["tick-hz-32_768"] }
embedded-alloc = "0.7.0"
libm = "0.2.16"
panic-halt = "1.0.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"], optional = true }
pid = "4.0.0"
ssd1306 = "0.10.0"
embedded-graphics = "0.8.2"
serde = { version = "1.0.228", default-features = false, features = ["derive"] }
bno08x-rvc = "0.1.2"
bbqueue = "0.5.1"
num-traits = { version = "0.2.19", default-features = false }
postcard = "1.1.3"
embedded-hal-compat = "0.13.0"
rgb = "0.8.50"
static_cell = "2.1.1"

[[bin]]
name = "nv1-hub"
test = false
bench = false

[features]
defmt = ["dep:defmt"]
defmt-rtt = ["dep:defmt-rtt"]
panic-probe = ["dep:panic-probe"]
default = ["debug"]
debug = [
    "defmt",
    "defmt-rtt",
    "panic-probe",
    "embassy-executor/defmt",
    "embassy-sync/defmt",
    "embassy-futures/defmt",
    "embassy-time/defmt",
    "embassy-time/defmt-timestamp-uptime",
    "embassy-stm32/defmt",
]
