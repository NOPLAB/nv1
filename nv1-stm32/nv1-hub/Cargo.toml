cargo-features = ["per-package-target"]

[package]
edition = "2021"
name = "nv1-hub"
version = "0.1.0"
forced-target = "thumbv7em-none-eabi"

[dependencies]
nv1-hub-core = { workspace = true }
nv1-hub-ui = { workspace = true, features = ["no_std"] }
nv1-msg = { workspace = true }

corncobs = { workspace = true }
cortex-m = { workspace = true }
cortex-m-rt = { workspace = true }
defmt = { workspace = true, optional = true }
defmt-rtt = { workspace = true, optional = true }
embassy-executor = { workspace = true }
embassy-futures = { workspace = true }
embassy-stm32 = { workspace = true }
embassy-sync = { workspace = true }
embassy-time = { workspace = true }
embedded-alloc = { workspace = true }
libm = { workspace = true }
panic-halt = { workspace = true }
panic-probe = { workspace = true, optional = true }
pid = { workspace = true }
ssd1306 = { workspace = true }
embedded-graphics = { workspace = true }
serde = { workspace = true }
bno08x-rvc = { workspace = true }
bbqueue = { workspace = true }
num-traits = { workspace = true }
postcard = { workspace = true }
embedded-hal-compat = { workspace = true }
rgb = { workspace = true }
static_cell = { workspace = true }

[[bin]]
name = "nv1-hub"
test = false
bench = false

[features]
defmt = ["dep:defmt"]
defmt-rtt = ["dep:defmt-rtt"]
panic-probe = ["dep:panic-probe"]
default = ["debug"]
debug = [
    "defmt",
    "defmt-rtt",
    "panic-probe",
    "embassy-executor/defmt",
    "embassy-sync/defmt",
    "embassy-futures/defmt",
    "embassy-time/defmt",
    "embassy-time/defmt-timestamp-uptime",
    "embassy-stm32/defmt",
]
