[workspace]
resolver = "3"
members = [
    "nv1-md",
    "nv1-md-core",
    "nv1-hub",
    "nv1-hub-core",
    "nv1-hub-ui",
    "nv1-hub-ui-tester",
]

[workspace.dependencies]
# Internal crates
nv1-msg = { path = "../nv1-msg" }
nv1-md-core = { path = "nv1-md-core" }
nv1-hub-core = { path = "nv1-hub-core" }
nv1-hub-ui = { path = "nv1-hub-ui" }

# Embassy
embassy-executor = { version = "0.10.0", features = [
    "platform-cortex-m",
    "executor-thread",
    "nightly",
] }
embassy-futures = "0.1.2"
embassy-stm32 = { version = "0.6.0", features = [
    "memory-x",
    "stm32f446re",
    "time-driver-tim12",
    "exti",
    "unstable-pac",
] }
embassy-sync = "0.8.0"
embassy-time = { version = "0.5.1", features = ["tick-hz-32_768"] }

# Cortex-M
cortex-m = { version = "0.7.7", features = [
    "inline-asm",
    "critical-section-single-core",
] }
cortex-m-rt = "0.7.5"

# defmt / panic
defmt = "1.0.1"
defmt-rtt = "1.1.0"
panic-halt = "1.0.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }

# Allocator / math
embedded-alloc = "0.7.0"
libm = "0.2.16"
num-traits = { version = "0.2.19", default-features = false }
pid = "4.0.0"

# Serialization / framing
corncobs = "0.1.4"
heapless = "0.9.2"
postcard = "1.1.3"
serde = { version = "1.0.228", default-features = false, features = ["derive"] }

# Graphics / display
embedded-graphics = "0.8.2"
embedded-graphics-simulator = "0.8.0"
ssd1306 = { version = "0.10.0", features = ["async"] }

# Hub-specific peripherals
bbqueue = "0.5.1"
bno08x-rvc = "0.1.2"
embedded-hal-compat = "0.13.0"
rgb = "0.8.50"
static_cell = "2.1.1"

# MIDI
midly = { version = "0.5.3", default-features = false }

# Host (UI tester)
sdl2 = { version = "0.38.0", features = ["bundled"] }
anyhow = "1.0.102"

[profile.dev]
debug = true
lto = true
opt-level = "s"
incremental = true

[profile.release]
debug = false
lto = true
opt-level = "s"
incremental = true

[profile.dev.package.nv1-md]
opt-level = 3

[profile.release.package.nv1-md]
opt-level = 3
